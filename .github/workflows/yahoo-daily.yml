name: Yahoo Fantasy Daily Snapshot
on:
  schedule:
    # 08:15 Istanbul = 05:15 UTC, year-round
    - cron: '15 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch Yahoo league data
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
          YAHOO_LEAGUE_KEY: ${{ vars.YAHOO_LEAGUE_KEY }}
        run: python scripts/fetch_yahoo.py
      - name: Commit updated snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/fantasy-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update Yahoo fantasy snapshot'
            git push
          fi
